<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>회원가입 · 통학 안전 안내</title>
<link rel="stylesheet" href="/css/week9.css">
<main class="auth">
  <h1>회원가입</h1>
  <p>가입 방법을 선택해 주세요. 생년월일은 받지 않습니다.</p>
  <fieldset id="age-choice"><legend>나이 확인</legend>
    <label><input type="radio" name="age" value="adult"> 만 14세 이상입니다</label>
    <label><input type="radio" name="age" value="child"> 만 14세 미만입니다</label>
  </fieldset>
  <p id="underage-help" hidden>만 14세 미만은 직접 가입할 수 없어요. 보호자가 만들어 준 아이디로 <a href="/login.html">로그인</a>해 주세요.</p>
  <form id="signup-form" hidden>
    <label>아이디<input name="loginId" autocomplete="username" minlength="4" maxlength="30" pattern="[a-z0-9_-]+" required></label>
    <label>비밀번호<input name="password" type="password" autocomplete="new-password" minlength="10" required></label>
    <label>별명<input name="nickname" maxlength="60" required></label>
    <button>가입</button>
  </form>
  <p id="message" role="status"></p>
  <a href="/login.html">로그인</a>
</main>
<script src="/js/auth.js"></script>
</html>
