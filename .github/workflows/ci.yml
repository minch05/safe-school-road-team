name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: safe_school_road_test
          MYSQL_USER: ssr_ci
          MYSQL_PASSWORD: ci-test-only
          MYSQL_ROOT_PASSWORD: ci-root-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-root-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/safe_school_road_test?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: ssr_ci
      DB_PASSWORD: ci-test-only
      LLM_API_KEY: ''
      GROQ_API_KEY: ''
      TMAP_APP_KEY: ''
      VWORLD_API_KEY: ''
      SAFEMAP_API_KEY: ''
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Seoul
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Test and package
        run: ./gradlew --no-daemon test bootJar
      - name: Browser logic tests
        run: node --test src/test/js/*.test.cjs
      - name: Public data quality tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests/test
      - name: Application jar
        uses: actions/upload-artifact@v7
        with:
          name: application
          path: build/libs/*.jar
