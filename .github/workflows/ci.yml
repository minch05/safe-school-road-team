name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  team-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew --no-daemon test bootJar
      - name: Browser logic tests
        run: node --test src/test/js/*.test.js
      - uses: actions/upload-artifact@v7
        with:
          name: application
          path: build/libs/*.jar
      # 가입·로그인·저장 거부 흐름을 실제 실행 파일로 확인 (TMAP 키 없음 → 근거 분석 503에서 멈춤)
      - run: |
          java -jar $(ls build/libs/*.jar | grep -v plain) > app.log 2>&1 &
          for i in $(seq 60); do curl -sf http://localhost:8081/health/setup && break; sleep 2; done
          scripts/api_smoke.sh http://localhost:8081 || (tail -50 app.log; exit 1)
      # 10주차 산출물 응답 예시(근거 분석·저장 경로). 실제 적재 공공자료 + TMAP 모의 경로선, 외부 호출 없음
      - run: ./gradlew --no-daemon test --tests '*ResponseExampleTests' -Dexamples.out=build/examples
      - run: for f in build/examples/*; do echo "=====FILE $(basename "$f")"; gzip -c "$f" | base64 -w0; echo; done
      - uses: actions/upload-artifact@v7
        with:
          name: response-examples
          path: build/examples/*
  should-could:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: safe_school_road_test
          MYSQL_USER: ssr_ci
          MYSQL_PASSWORD: ci-test-only
          MYSQL_ROOT_PASSWORD: ci-root-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-root-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/safe_school_road_test?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: ssr_ci
      DB_PASSWORD: ci-test-only
      LLM_API_KEY: ''
      GROQ_API_KEY: ''
      TMAP_APP_KEY: ''
      VWORLD_API_KEY: ''
      SAFEMAP_API_KEY: ''
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Seoul
    defaults:
      run:
        working-directory: apps/should-could
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Test and package
        run: ./gradlew --no-daemon test bootJar
      - name: Browser logic tests
        run: node --test src/test/js/*.test.cjs
      - name: Public data quality tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: should-could-test-reports
          path: apps/should-could/build/reports/tests/test
      - name: Application jar
        uses: actions/upload-artifact@v7
        with:
          name: should-could-application
          path: apps/should-could/build/libs/*.jar
