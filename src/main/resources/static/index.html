<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>통학 안전·안내 서비스 · 첫 경로</title><link rel="stylesheet" href="/css/week9.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><main><p id="sample-banner" class="sample-banner" role="status" hidden>예시 자료(실제 경로 아님)</p><header><h1>통학 안전·안내 서비스</h1><p class="hint">네이버 지도 기본 · VWorld 보조 · 좌표 미리보기. 공공자료와 실제 경로가 아직 확인되지 않으면 안전하다고 판단하지 않아요.</p><div><a href="/login.html">로그인</a> · <a href="/signup.html">회원가입</a> <span id="user"></span><button id="logout" hidden>로그아웃</button></div></header><div class="grid"><section><div id="map" aria-label="출발지와 도착지를 고르는 지도"></div><p id="map-status" class="hint" role="status">지도를 불러오는 중이에요.</p></section><section class="panel"><h2>첫 경로 찾기</h2><p class="hint">지도에서 출발지, 도착지를 차례로 누르거나 아래 좌표를 직접 입력하세요.</p><label>출발지 검색<input id="start-query" placeholder="주소 또는 장소"></label><button id="start-search">검색</button><div id="start-results"></div><label>출발 위도<input id="start-lat" type="number" step="any" value="37.5900"></label><label>출발 경도<input id="start-lng" type="number" step="any" value="127.0870"></label><label>도착지 검색<input id="end-query" placeholder="주소 또는 장소"></label><button id="end-search">검색</button><div id="end-results"></div><label>도착 위도<input id="end-lat" type="number" step="any" value="37.5940"></label><label>도착 경도<input id="end-lng" type="number" step="any" value="127.0920"></label><button id="route-search">실제 보행 경로 찾기</button><p id="message" role="status"></p><div id="candidates" aria-live="polite"></div><ul id="warnings" class="warnings"></ul><p id="selected-id" class="hint" role="status"></p><label id="route-name-label" hidden>경로 이름 (1~30자)<input id="route-name" maxlength="30" placeholder="예: 망우초 가는 길" autocomplete="off"></label><button id="confirm-route" type="button" hidden>경로 확정·저장</button><p id="confirm-message" class="hint" role="status" aria-live="polite"></p><h3>공공자료 범위</h3><p id="data-status" class="hint"></p></section></div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="/js/week9-map.js"></script></html>
