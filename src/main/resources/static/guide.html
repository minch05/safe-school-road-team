<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>길 안내 · 통학 안전 안내</title>
<link rel="stylesheet" href="/css/week9.css">
<link rel="stylesheet" href="/css/guide.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<main class="guide">
  <h1>길 안내</h1>
  <p id="guide-status" role="status">저장한 경로를 불러오는 중이에요.</p>

  <section id="route-list" aria-label="저장한 경로" hidden>
    <h2>저장한 경로</h2>
    <ul id="routes"></ul>
  </section>

  <section id="route-guide" aria-label="안내" hidden>
    <h2 id="route-name"></h2>
    <div id="guide-map" role="region" aria-label="경로선과 안내 지점 지도" hidden></div>
    <p id="now" class="guide-now" aria-live="assertive"></p>
    <p id="next-distance"></p>
    <ol id="points"></ol>
    <p id="line-note"></p>
    <button id="start" type="button">안내 시작</button>
    <button id="stop" type="button" hidden>안내 멈추기</button>
    <button id="check-route" type="button">경로 달라짐 확인</button>
    <p id="change-result" role="status"></p>
    <a id="replace-route" href="/">같은 출발지·도착지로 다시 등록</a>
    <button id="delete-route" type="button">이 경로 삭제</button>
    <button id="back" type="button">목록으로</button>
    <p class="note">신호는 확정 자료가 없어요. 횡단보도에서는 꼭 멈춰서 실제 신호와 양쪽을 확인해요.</p>
  </section>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/js/guide-geo.js"></script>
<script src="/js/team-api.js"></script>
<script src="/js/guide.js"></script>
</html>
