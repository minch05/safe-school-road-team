<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: common-head('가입하기')}"></head>
<body>
<!-- C-03 가입: 연령 확인 -->
<main class="page">
    <header class="bar"><a class="icon" th:href="@{/}" aria-label="뒤로"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="/icons/ui.svg#back"></use></svg></a><h1>가입하기</h1></header>
    <div class="body">
        <div class="box info" th:if="${session.pendingRoute != null}">
            <p>가입하거나 로그인하면 비교하던 경로를 이어서 저장할 수 있어요.</p>
            <a class="btn soft" th:unless="${under14}" th:href="@{/login}">기존 계정으로 로그인</a>
        </div>
        <div class="hello"><h2>나이를 골라 주세요</h2><p>생년월일은 받지 않아요.</p></div>
        <a class="card" th:href="@{/signup/form}" style="grid-template-columns:48px 1fr;align-items:center">
            <span style="font-size:34px">🧑</span>
            <span><b style="font-size:18px">만 14세 이상이에요</b><br><span class="meta">보호자·개인 사용자</span></span>
        </a>
        <a class="card" th:href="@{/signup(under14=true)}" style="grid-template-columns:48px 1fr;align-items:center">
            <span style="font-size:34px">🧒</span>
            <span><b style="font-size:18px">만 14세 미만이에요</b><br><span class="meta">보호자가 계정을 만들어 줘요</span></span>
        </a>
        <div class="box warn" th:if="${under14}" role="alert">
            <b>만 14세 미만은 직접 가입할 수 없어요.</b>
            <p style="margin:6px 0 12px">보호자가 만들어 준 아이디로 로그인하세요. 보호자는 가입한 뒤 "아이 계정 만들기"로 만들 수 있어요.</p>
            <a class="btn primary" th:href="@{/login}">로그인하러 가기</a>
        </div>
    </div>
</main>
</body>
</html>
