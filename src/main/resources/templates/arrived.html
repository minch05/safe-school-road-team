<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: common-head('도착')}"></head>
<body>
<!-- N-02 도착 -->
<main class="page">
    <div class="body center arrival">
        <div class="arrival-icon" aria-hidden="true">✓</div>
        <h1 style="margin:0;font-size:28px">도착했어요!</h1>
        <p style="margin:0;color:var(--sub)" th:text="${route.endName}">도착지</p>
        <div class="box ok" th:if="${recorded}"><b>도착 기록을 저장했어요</b><p class="hint">보호자 화면에서 확인할 수 있어요. 휴대폰 알림 수신은 보호자의 알림 설정과 연결 상태에 따라 달라요.</p></div>
        <div class="box warn" th:if="${familyTrip and !recorded}"><b>도착 기록은 확인되지 않았어요</b><p class="hint">보호자에게 도착했다고 직접 알려 주세요. 알림을 받았다고 확인된 상태는 아니에요.</p><a class="link" th:href="@{/routes/{id}/navigate(id=${route.id})}">길 안내로 돌아가기</a></div>
        <p class="hint">오늘도 조심해서 잘 왔어요.</p>
        <div class="arrival-actions">
        <a class="btn primary big" th:href="@{/}">처음 화면으로</a></div>
    </div>
</main>
</body>
</html>
