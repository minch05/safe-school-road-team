spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 5000
      validation-timeout: 2000
  jpa:
    hibernate:
      ddl-auto: validate
  devtools:
    restart:
      enabled: false
server:
  address: 127.0.0.1
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true
        http-only: true
        same-site: lax
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

facility:
  data-dir: ${PUBLIC_DATA_DIR:/var/lib/safe-school-road/public-data}
logging:
  file:
    name: /var/log/safe-school-road/application.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 200MB
