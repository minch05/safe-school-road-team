<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 홈 위쪽 지도 + 위치 동의 (R-01, K-01). 위치는 이 폰에서만 쓰고 서버로 보내지 않는다. -->
<th:block th:fragment="map">
    <div class="homemap" id="homemap">
        <div class="ask" id="geoAsk" hidden>
            <span class="hint">내 위치는 이 폰에서만 사용해요</span>
            <button type="button" class="btn soft" id="geoAllow">내 위치 보기</button>
            <button type="button" class="link quiet" id="geoLater">나중에</button>
        </div>
        <span class="pill" id="geoPill" hidden></span>
    </div>
</th:block>

<th:block th:fragment="script">
    <script>
        (() => {
            const preview = document.querySelector(".kid-map-preview");
            function boot() {
            const KEY = 'ssr-geo';
            const map = App.makeMap('homemap', { zoom: 15 });
            window.homeMap = map;
            const ask = document.getElementById('geoAsk'), pill = document.getElementById('geoPill');
            let me = null, watchId = null;
            const read = v => { try { return localStorage.getItem(KEY); } catch (e) { return null; } };
            const write = v => { try { localStorage.setItem(KEY, v); } catch (e) {} };

            // 지도 SDK의 클릭/드래그 처리와 위치 컨트롤을 분리한다.
            for (const control of [ask, pill]) {
                for (const event of ['click', 'pointerdown', 'mousedown', 'touchstart'])
                    control.addEventListener(event, e => e.stopPropagation());
            }
            function clearWatch() {
                if (watchId !== null) navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
            function permissionHelp() {
                App.modal(`<h2>위치 권한을 확인해 주세요</h2>
                    <p>브라우저에서 위치 사용이 차단되어 있어요. 주소창 옆 사이트 설정에서 위치를 허용한 뒤 다시 눌러 주세요.</p>
                    <p>앱 안 브라우저라면 사파리나 크롬에서 열어 주세요. 휴대폰의 위치 서비스도 켜져 있어야 해요.</p>
                    <p class="hint">현재 위치는 이 기기에서만 사용해요. 서버로 보내지 않아요.</p>
                    <button type="button" class="btn primary" onclick="App.closeModal()">확인</button>`);
            }
            async function on(userAction = false) {
                clearWatch();
                // 이미 차단된 권한은 다시 요청해도 브라우저가 허용창을 띄우지 않는다.
                let permission;
                try { permission = await navigator.permissions?.query({ name: 'geolocation' }); } catch (e) {}
                if (permission?.state === 'denied') {
                    off('위치 권한 차단됨', permissionHelp);
                    if (userAction) permissionHelp();
                    return;
                }
                ask.hidden = true; pill.hidden = false;
                pill.textContent = '현재 위치를 찾는 중…';
                window.homeMapFollowing = false;
                watchId = navigator.geolocation.watchPosition(p => {
                    write('granted'); window.homeMapFollowing = true;
                    pill.textContent = '현재 위치 사용 중';
                    const ll = [p.coords.latitude, p.coords.longitude];
                    if (!me) { me = App.meDot(ll).addTo(map); map.setView(ll, 16); } else me.setLatLng(ll);
                }, error => {
                    const message = error.code === 1 ? '위치 권한 차단됨'
                        : error.code === 3 ? '위치 확인 시간이 초과됐어요' : '현재 위치를 찾을 수 없어요';
                    if (error.code === 1) write('denied');
                    off(message, error.code === 1 ? permissionHelp : () => on(true));
                    if (userAction) {
                        if (error.code === 1) permissionHelp();
                        else App.toast(message + '. 휴대폰 위치 서비스와 연결을 확인한 뒤 다시 시도해 주세요.');
                    }
                }, { enableHighAccuracy: true, maximumAge: 10000, timeout: 12000 });
            }
            function off(message = '현재 위치 꺼짐', action = () => on(true)) {
                clearWatch(); window.homeMapFollowing = false;
                if (me) { me.remove(); me = null; }
                ask.hidden = true; pill.hidden = false;
                pill.replaceChildren(document.createTextNode(message + ' · '));
                const button = document.createElement('button');
                button.type = 'button'; button.className = 'link'; button.id = 'geoOn';
                button.textContent = message === '위치 권한 차단됨' ? '허용 방법' : message === '현재 위치 꺼짐' ? '내 위치 보기' : '다시 시도';
                button.addEventListener('click', action);
                pill.append(button);
            }
            document.getElementById('geoAllow').onclick = () => on(true);
            document.getElementById('geoLater').onclick = () => { write('denied'); off(); };
            if (!window.isSecureContext) { ask.hidden = true; pill.hidden = false; pill.textContent = '현재 위치는 HTTPS 연결에서 사용할 수 있어요'; }
            else if (!('geolocation' in navigator)) { pill.hidden = false; pill.textContent = '이 브라우저는 위치를 쓸 수 없어요'; }
            else if (read() === 'granted') on();
            else if (read() === 'denied') off();
            else ask.hidden = false;
            }
            if (preview) preview.addEventListener("toggle", () => { if (preview.open && !window.homeMap) boot(); if (window.homeMap) homeMap.invalidateSize(); });
            else boot();
        })();
    </script>
</th:block>
</body>
</html>
