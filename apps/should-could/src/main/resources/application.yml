spring:
  application:
    name: safe-school-road
  config:
    # 프로젝트 맨 위 .env 를 읽는다 (없어도 실행은 된다). 실행은 프로젝트 맨 위 폴더에서 한다.
    import: optional:file:.env[.properties]
  datasource:
    # 프로젝트 전용 Docker MySQL(3308). 기존 설치 MySQL(3306)은 사용하지 않는다.
    # 배포할 때는 .env(또는 서버 환경변수)의 DB_URL / DB_USERNAME / DB_PASSWORD 로 바꾼다.
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3308/safe_school_road?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:safe_school_app}
    password: ${DB_PASSWORD:}
    hikari:
      data-source-properties:
        # 여러 줄 INSERT 를 한 번에 보내 공공데이터 적재를 빠르게 한다
        rewriteBatchedStatements: true
  jpa:
    hibernate:
      # 개발 중에는 엔티티에 맞춰 테이블을 자동으로 고친다. 배포에서는 validate 로 바꾼다.
      ddl-auto: update
    open-in-view: false
  ai:
    # LLM 연결은 LlmModels 가 회사별로 직접 만든다(Groq 메인, Gemini 예비). Spring AI 자동 설정은 끈다.
    model:
      chat: none
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
  sql:
    init:
      # resources/schema.sql 을 켤 때마다 실행한다 (자동 로그인 토큰·공공데이터 시설 테이블. CREATE TABLE IF NOT EXISTS 라 안전)
      mode: always

server:
  port: 8080

# 공공데이터 적재 (FR-15). 실행 방법은 FacilityImporter 맨 위 설명 참고
facility:
  # "서울"(전체) 또는 자치구 이름 하나 (예: 중랑구)
  region: 서울
  # 내려받은 원본 파일이 있는 폴더 (프로젝트 맨 위 기준)
  data-dir: 무제 폴더

# API 문서는 로그인 후 /swagger-ui/index.html. 운영에서는 꺼 두고 필요할 때만 켠다.
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    csrf:
      enabled: true
      cookie-name: XSRF-TOKEN
      header-name: X-XSRF-TOKEN

risk:
  accident-year: ${RISK_ACCIDENT_YEAR:2025}
  include-child-pedestrian: ${RISK_INCLUDE_CHILD_PEDESTRIAN:true}

# AI 안내문 모델 순서 (LlmModels). "회사:모델|최대토큰" 을 쉼표로(|최대토큰은 생략 가능, qwen 은 분당 출력 1,000토큰이라 900). 앞에서부터 쓰고 하루 한도에 닿으면 다음으로 넘어간다.
# 키가 없는 회사는 건너뛴다(GROQ_API_KEY, LLM_API_KEY). 모두 없거나 한도면 정해진 문장(TemplateGuide).
app:
  llm:
    chain: ${LLM_CHAIN:groq:qwen/qwen3.8-27b|900,groq:openai/gpt-oss-120b|3000,gemini:gemini-3.5-flash,gemini:gemini-3.6-flash}

  walk-network:
    file: ${WALK_NETWORK_FILE:}
    sha256: ${WALK_NETWORK_SHA256:}
